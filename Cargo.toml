[package]
name = "the-markdown-commons"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Shared markdown parsing and rendering for HTML and egui"

[lib]
name = "tmc"
path = "src/lib.rs"

[features]
default = []
egui = ["dep:egui", "dep:egui_extras", "dep:pulldown-cmark"]
auto-ui-tests = ["egui", "dep:eframe"]

[dependencies]
egui = { version = "0.29.1", optional = true }
egui_extras = { version = "0.29.1", features = ["syntect", "all_loaders"], optional = true }
eframe = { version = "0.29.1", optional = true }
pulldown-cmark = { version = "0.12.2", optional = true }

[dev-dependencies]
cap = "0.1.2"
anyhow = "1"
criterion = "0.5"
insta = "1.43"

[[bench]]
name = "parse"
harness = false

[[bin]]
name = "tmc_egui_auto_ui"
path = "src/bin/tmc_egui_auto_ui.rs"
required-features = ["auto-ui-tests"]
